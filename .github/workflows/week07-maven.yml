
name: Week 07 - Java Maven CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Test and Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout COMP3104 repository
        uses: actions/checkout@v4

      - name: Checkout Java Maven sample project
        uses: actions/checkout@v4
        with:
          repository: pritamworld/java-maven-ci-example
          ref: master
          path: java-maven-ci-example

      - name: Set up Java 11 and Maven cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
          cache-dependency-path: java-maven-ci-example/pom.xml

      - name: Show Java and Maven versions
        run: |
          java -version
          mvn -version

      - name: Build Java project
        working-directory: java-maven-ci-example
        run: mvn -B -DskipTests clean package

      - name: Run unit tests
        working-directory: java-maven-ci-example
        run: mvn -B test

      - name: Upload Java build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: week07-java-build
          path: java-maven-ci-example/target/*.jar
          if-no-files-found: warn
